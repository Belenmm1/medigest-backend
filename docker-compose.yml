version: '3.9'

# ═══════════════════════════════════════════════════════════════
# MediGest Pro — Docker Compose
# Servicios: app (Node.js) + postgres + redis
# ═══════════════════════════════════════════════════════════════

services:

  # ─── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medigest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-medigest_pro}
      POSTGRES_USER:     ${DB_USER:-medigest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medigest_secret_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_auth.sql:/docker-entrypoint-initdb.d/001_auth.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medigest} -d ${DB_NAME:-medigest_pro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medigest_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── API Node.js ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medigest_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV:    production
      DB_HOST:     postgres
      REDIS_HOST:  redis
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: medigest_network
